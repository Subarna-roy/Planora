<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up - PlaNora</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="navbar"><a class="logo" href="index.html">Pla<span>Nora</span></a><a href="index.html">← Home</a></header>
<div class="form-box"><h2>Create Account</h2>
<form action="register" method="post">
<label>Full Name</label><input class="input" name="name" required>
<label>Email</label><input class="input" type="email" name="email" required>
<label>Phone Number</label><input class="input" name="phone" required pattern="[0-9]{10}">
<label>Password</label><input class="input" type="password" name="password" required>
<button class="btn" type="submit">Create Account</button>
</form><p class="muted" style="margin-top:18px">Already registered? <a style="color:#c084fc" href="login.html">Login</a></p>
</div></body></html>
