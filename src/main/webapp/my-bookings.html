<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Bookings - PlaNora</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        .booking-page {
            padding: 50px 0;
        }

        .booking-header {
            margin-bottom: 30px;
        }

        .booking-header h1 {
            margin-bottom: 8px;
        }

        .booking-card {
            background: #161620;
            border: 1px solid #292936;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .booking-card h2 {
            margin-bottom: 5px;
        }

        .booking-id {
            color: #999;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-box {
            background: #20202d;
            padding: 15px;
            border-radius: 10px;
        }

        .detail-box span {
            display: block;
            color: #999;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .detail-box strong {
            color: #fff;
            font-size: 16px;
        }

        .total-price {
            color: #c084fc !important;
            font-size: 20px !important;
        }

        .booking-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cancel-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: #dc2626;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #b91c1c;
        }

        .no-bookings {
            background: #161620;
            border: 1px solid #292936;
            border-radius: 18px;
            padding: 40px;
            text-align: center;
        }

        .no-bookings h2 {
            margin-bottom: 10px;
        }

        .no-bookings p {
            color: #aaa;
            margin-bottom: 20px;
        }

        .browse-btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: #aaa;
            padding: 30px;
        }

        .error-message {
            background: #2a1515;
            border: 1px solid #6b2020;
            color: #ff9999;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        /* NAVIGATION */

        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .navbar .nav-links a {
            color: #ddd;
            white-space: nowrap;
        }

        .navbar .nav-links a:hover {
            color: #c084fc;
        }

        /* MOBILE */

        @media(max-width:700px) {

            .booking-details {
                grid-template-columns: 1fr;
            }

            .navbar .nav-links {
                gap: 12px;
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <a class="logo" href="index.html">
        Pla<span>Nora</span>
    </a>

    <nav class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="my-bookings.html">
            My Bookings
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a href="LogoutServlet">
            Logout
        </a>

    </nav>

</header>


<!-- ================= MY BOOKINGS ================= -->

<section class="booking-page container">

    <div class="booking-header">

        <h1>
            My Bookings
        </h1>

        <p class="muted">
            View and manage your concert bookings.
        </p>

    </div>


    <div id="bookings">

        <div class="loading">
            Loading your bookings...
        </div>

    </div>

</section>


<!-- ================= JAVASCRIPT ================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    loadBookings();

});


/* =====================================================
   LOAD BOOKINGS
   ===================================================== */

function loadBookings() {

    fetch("MyBookingsServlet", {
        method: "GET",
        credentials: "same-origin"
    })

    .then(response => {

        if (!response.ok) {

            if (response.status === 401) {
                window.location.href = "login.html";
                return null;
            }

            throw new Error(
                "Unable to load bookings. Server returned "
                + response.status
            );
        }

        return response.json();

    })

    .then(data => {

        if (!data) {
            return;
        }

        console.log("MyBookingsServlet response:", data);


        /* ================= LOGIN CHECK ================= */

        if (data.loggedIn !== true) {

            window.location.href = "login.html";

            return;
        }


        const bookingsDiv =
            document.getElementById("bookings");


        /* ================= ERROR CHECK ================= */

        if (data.error) {

            bookingsDiv.innerHTML = `

                <div class="error-message">

                    <h3>
                        Unable to Load Bookings
                    </h3>

                    <p>
                        ${escapeHtml(data.error)}
                    </p>

                </div>

            `;

            return;
        }


        /* ================= NO BOOKINGS ================= */

        if (!Array.isArray(data.bookings) ||
            data.bookings.length === 0) {

            bookingsDiv.innerHTML = `

                <div class="no-bookings">

                    <h2>
                        No Bookings Yet 🎟️
                    </h2>

                    <p>
                        You have not booked any concert tickets yet.
                    </p>

                    <a
                        href="events.html"
                        class="browse-btn">

                        Browse Events

                    </a>

                </div>

            `;

            return;
        }


        /* ================= DISPLAY BOOKINGS ================= */

        bookingsDiv.innerHTML = "";


        data.bookings.forEach(booking => {

            const card =
                document.createElement("div");

            card.className =
                "booking-card";


            card.innerHTML = `

                <h2>
                    ${escapeHtml(booking.eventName)}
                </h2>

                <div class="booking-id">

                    Booking ID:
                    #${booking.bookingId}

                </div>


                <div class="booking-details">


                    <div class="detail-box">

                        <span>
                            Artist
                        </span>

                        <strong>
                            ${escapeHtml(booking.artist)}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>
                            Venue
                        </span>

                        <strong>
                            ${escapeHtml(booking.venue)}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>
                            Date
                        </span>

                        <strong>
                            ${escapeHtml(booking.eventDate)}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>
                            Time
                        </span>

                        <strong>
                            ${escapeHtml(booking.eventTime)}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>
                            Ticket Price
                        </span>

                        <strong>
                            ₹${Number(booking.ticketPrice).toFixed(2)}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>
                            Tickets Booked
                        </span>

                        <strong>
                            ${booking.quantity}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>
                            Total Amount
                        </span>

                        <strong class="total-price">

                            ₹${Number(booking.totalPrice).toFixed(2)}

                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>
                            Booking Date
                        </span>

                        <strong>
                            ${escapeHtml(booking.bookingDate)}
                        </strong>

                    </div>


                </div>


                <div class="booking-actions">

                    <button
                        class="cancel-btn"
                        onclick="cancelBooking(${booking.bookingId})">

                        Cancel Booking

                    </button>

                </div>

            `;


            bookingsDiv.appendChild(card);

        });

    })


    /* ================= LOAD ERROR ================= */

    .catch(error => {

        console.error(
            "Booking loading error:",
            error
        );


        document.getElementById("bookings").innerHTML = `

            <div class="error-message">

                <h3>
                    Unable to Load Bookings
                </h3>

                <p>
                    Please try again later.
                </p>

            </div>

        `;

    });

}


/* =====================================================
   CANCEL BOOKING
   ===================================================== */

function cancelBooking(bookingId) {


    /* ================= CONFIRMATION ================= */

    const confirmCancel = confirm(
        "Are you sure you want to cancel this booking?"
    );


    if (!confirmCancel) {
        return;
    }


    /* ================= SEND REQUEST ================= */

    const formData = new URLSearchParams();

    formData.append(
        "bookingId",
        bookingId
    );


    fetch("CancelBookingServlet", {

        method: "POST",

        headers: {
            "Content-Type":
                "application/x-www-form-urlencoded"
        },

        body: formData.toString(),

        credentials: "same-origin"

    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Unable to cancel booking."
            );

        }

        return response.text();

    })

    .then(result => {

        console.log(
            "CancelBookingServlet response:",
            result
        );


        if (
            result.trim() !==
            "Booking cancelled successfully!"
        ) {

            throw new Error(
                result || "Cancellation failed."
            );

        }


        alert(
            "Booking cancelled successfully!"
        );


        loadBookings();

    })

    .catch(error => {

        console.error(
            "Cancel booking error:",
            error
        );


        alert(
            error.message ||
            "Unable to cancel the booking. Please try again."
        );

    });

}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>


</body>

</html>
