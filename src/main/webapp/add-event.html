<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Add Event - PlaNora</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="navbar"><a class="logo" href="index.html">Pla<span>Nora</span></a><a href="admin-dashboard.html">← Admin Dashboard</a></header>
<div class="form-box"><h2>Add New Concert</h2><form action="admin/add-event" method="post">
<label>Event Name</label><input class="input" name="eventName" required>
<label>Artist / Performer</label><input class="input" name="artist" required>
<label>Date</label><input class="input" type="date" name="eventDate" required>
<label>Time</label><input class="input" type="time" name="eventTime" required>
<label>Venue</label><input class="input" name="venue" required>
<label>Description</label><textarea class="input" name="description"></textarea>
<label>Ticket Price</label><input class="input" type="number" step="0.01" name="ticketPrice" required>
<label>Available Tickets</label><input class="input" type="number" name="availableTickets" required>
<label>Image URL</label><input class="input" name="imageUrl">
<button class="btn" type="submit">Add Concert</button></form></div></body></html>
